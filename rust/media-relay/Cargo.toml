[package]
name = "t4-media-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
percent-encoding = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-tls = "0.6"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "cookies", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-service = "0.3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
