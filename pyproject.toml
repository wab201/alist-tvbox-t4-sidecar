[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alist-tvbox-t4-sidecar"
version = "0.1.0"
description = "Non-invasive T4 sidecar for authorized AList-TVBox subscriptions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "requests>=2.32,<3",
    "pycryptodome>=3.20,<4",
    "lxml>=5,<7",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["sidecar*"]
