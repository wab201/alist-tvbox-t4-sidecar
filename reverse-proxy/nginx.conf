server {
    listen 80;
    server_name _;

    location /t4/ {
        proxy_pass http://t4-sidecar:8765/t4/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
