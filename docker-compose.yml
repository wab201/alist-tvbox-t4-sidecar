services:
  t4-sidecar:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      T4_SOURCES_FILE: /app/config/sources.json
    ports:
      - "8765:8765"
    volumes:
      # Optional custom secspider keyring fallback. Keep this file read-only.
      # - ./secrets/atvp-keyring.json:/run/secrets/atvp-keyring.json:ro
      # Optional file-based source registry. Uncomment when not using the
      # ALIST_TVBOX_SUBSCRIPTION_URL environment source.
      # - ./config/sources.json:/app/config/sources.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/t4/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Put this service behind the AT reverse proxy when a same-origin /t4/ path
  # is required. The AT container itself remains unchanged.
  t4-proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      t4-sidecar:
        condition: service_healthy
    ports:
      - "8766:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
