services:
  t4-sidecar:
    image: ${T4_IMAGE:-ghcr.io/wab201/alist-tvbox-t4-sidecar:latest}
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # 生成客户端地址时保留反向代理传入的 HTTPS 协议。
      FORWARDED_ALLOW_IPS: "*"
      T4_SOURCES_FILE: ${T4_SOURCES_FILE:-/app/config/sources.json}
      T4_PLUGIN_DIR: ${T4_PLUGIN_DIR:-/data/plugins}
      T4_LOG_FILE: /data/logs/playback.jsonl
      T4_COMPATIBILITY_REPORT: /data/reports/compatibility-latest.json
      T4_SUBSCRIPTION_CACHE_TTL: ${T4_SUBSCRIPTION_CACHE_TTL:-30}
      T4_UPLOAD_MAX_BYTES: ${T4_UPLOAD_MAX_BYTES:-2000000}
    ports:
      - "${T4_PORT:-8765}:8765"
    volumes:
      - t4_data:/data
      # 可选自定义 secspider keyring，只读挂载，不提交真实文件。
      # - ./secrets/atvp-keyring.json:/run/secrets/atvp-keyring.json:ro
      # 不使用环境订阅 ALIST_TVBOX_SUBSCRIPTION_URL 时可启用文件 source。
      # - ./config/sources.json:/app/config/sources.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/t4/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 可选 Nginx 入口，不修改 AT 本体；路径拼接见 NAS_DEPLOYMENT.md。
  t4-proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      t4-sidecar:
        condition: service_healthy
    ports:
      - "8766:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  t4_data:
