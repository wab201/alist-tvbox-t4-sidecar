services:
  t4-sidecar:
    image: ${T4_IMAGE:-ghcr.io/wab201/alist-tvbox-t4-sidecar:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Preserve HTTPS from the reverse proxy when generating client API URLs.
      FORWARDED_ALLOW_IPS: "*"
      T4_SOURCES_FILE: ${T4_SOURCES_FILE:-/app/config/sources.json}
      T4_PLUGIN_DIR: ${T4_PLUGIN_DIR:-/data/plugins}
      T4_LOG_FILE: /data/logs/playback.jsonl
      T4_COMPATIBILITY_REPORT: /data/reports/compatibility-latest.json
      T4_SUBSCRIPTION_CACHE_TTL: ${T4_SUBSCRIPTION_CACHE_TTL:-30}
      T4_UPLOAD_MAX_BYTES: ${T4_UPLOAD_MAX_BYTES:-2000000}
    ports:
      - "${T4_PORT:-8765}:8765"
    volumes:
      - t4_data:/data
      # Optional custom secspider keyring fallback. Keep this file read-only.
      # - ./secrets/atvp-keyring.json:/run/secrets/atvp-keyring.json:ro
      # Optional file-based source registry. Uncomment when not using the
      # ALIST_TVBOX_SUBSCRIPTION_URL environment source.
      # - ./config/sources.json:/app/config/sources.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/t4/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Put this service behind the AT reverse proxy when a same-origin /t4/ path
  # is required. The AT container itself remains unchanged.
  t4-proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      t4-sidecar:
        condition: service_healthy
    ports:
      - "8766:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  t4_data:
