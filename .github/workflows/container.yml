name: Build and publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build optional Rust media module
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 test --manifest-path rust/media-relay/Cargo.toml --release --locked -j 2
          cargo +1.99.1 build --manifest-path rust/media-relay/Cargo.toml --release --locked -j 2

      - name: Set up client helper build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify optional FM helper builds from source
        run: |
          python scripts/build_fm_accelerator.py --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/fm-accelerator.jar"
          python -c "import os,zipfile; from pathlib import Path; shipped=Path('sidecar/client_assets/fm-accelerator.jar'); rebuilt=Path(os.environ['RUNNER_TEMP'])/'fm-accelerator.jar'; a=zipfile.ZipFile(shipped); b=zipfile.ZipFile(rebuilt); assert a.read('t4-build.json')==b.read('t4-build.json')"

      - name: Prepare container runtime directories
        run: |
          sudo mkdir -p /data/plugins /data/logs /data/reports
          sudo chown -R "$(id -u):$(id -g)" /data

      - name: Verify Linux runtime and tests
        env:
          # The hosted runner has no container /data volume. Keep CI state
          # writable without changing the image's runtime defaults.
          T4_PLUGIN_DIR: ${{ runner.temp }}/t4-plugins
          T4_LOG_FILE: ${{ runner.temp }}/t4-logs/playback.jsonl
          T4_COMPATIBILITY_REPORT: ${{ runner.temp }}/t4-reports/compatibility.json
          T4_RUST_RELAY_BIN: ${{ github.workspace }}/rust/media-relay/target/release/t4-media-relay
        run: |
          python -m pip install ".[test]"
          python -m pip check
          python -m sidecar.worker.dependencies
          node --version
          python -m pytest --ignore=tests/reports -o addopts='' -m 'not requires_packet_capture' -q --tb=short
          test -x "$T4_RUST_RELAY_BIN"
          sudo unshare --net -- env T4_PLUGIN_DIR="$T4_PLUGIN_DIR" T4_LOG_FILE="$T4_LOG_FILE" \
            T4_COMPATIBILITY_REPORT="$T4_COMPATIBILITY_REPORT" \
            T4_RUST_RELAY_BIN="$T4_RUST_RELAY_BIN" \
            bash -e -c 'ip link set lo up; exec "$@"' bash "$(command -v python)" -m pytest \
            tests/rust/test_downstream_diagnostics.py tests/rust/test_ttfb_diagnostics.py \
            -m requires_packet_capture -o addopts='' -q --tb=short --junitxml="$RUNNER_TEMP/t4-kernel.xml"
          python -c "import os,xml.etree.ElementTree as E; suites=list(E.parse(os.environ['RUNNER_TEMP']+'/t4-kernel.xml').iter('testsuite')); assert sum(int(s.get('tests',0)) for s in suites)==7; assert all(int(s.get(k,0))==0 for s in suites for k in ('failures','errors','skipped'))"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: version
        run: echo "value=$(python -c 'from sidecar import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export NAS deployment image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA:0:7}"
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "$tag"
          mkdir -p /tmp/t4-image
          docker save "$tag" | gzip -1 > /tmp/t4-image/t4-sidecar.tar.gz
          cd /tmp/t4-image
          sha256sum t4-sidecar.tar.gz > SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/image_archive_identity.py" \
            t4-sidecar.tar.gz --revision "$GITHUB_SHA" --tag "$tag" > image-id.json

      - name: Verify built image
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="ghcr.io/${GITHUB_REPOSITORY}:sha-${GITHUB_SHA:0:7}"
          docker run --rm "$tag" python -m sidecar.worker.dependencies
          docker run --rm -e EXPECTED_VERSION "$tag" python -c \
            "import os; from importlib.resources import files; from sidecar import __version__; assert __version__ == os.environ['EXPECTED_VERSION']; assert files('sidecar.web').joinpath('assets/icons/save.svg').is_file()"
          docker run -d --name t4-image-smoke -p 127.0.0.1:18765:8765 "$tag"
          trap 'docker logs t4-image-smoke; docker rm -f t4-image-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/t4/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/t4/health | python -c \
            "import json,os,sys; data=json.load(sys.stdin); assert data['status']=='ok' and data['version']==os.environ['EXPECTED_VERSION']"
          curl --fail --silent http://127.0.0.1:18765/t4/assets/icons/save.svg > /dev/null
          curl --fail --silent http://127.0.0.1:18765/t4/config.json | python -c \
            "import json,sys; assert json.load(sys.stdin)=={'sites':[]}"
          docker rm -f t4-image-smoke
          docker run -d --name t4-image-smoke -e T4_MEDIA_ENGINE=rust -p 127.0.0.1:18765:8765 "$tag"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/t4/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18765/t4/health | python -c \
            "import json,os,sys; data=json.load(sys.stdin); assert data['version']==os.environ['EXPECTED_VERSION'] and data['media_engine']=='rust'"
          curl --fail --silent http://127.0.0.1:18765/t4/config.json | python -c \
            "import json,sys; assert json.load(sys.stdin)=={'sites':[]}"
          curl --fail --silent http://127.0.0.1:18765/t4/assets/icons/save.svg > /dev/null

      - name: Upload NAS deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.sha }}
          path: /tmp/t4-image/
          retention-days: 3
          if-no-files-found: error
