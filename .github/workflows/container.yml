name: Build and publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export NAS deployment image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA:0:7}"
          docker pull "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "$tag"
          mkdir -p /tmp/t4-image
          docker save "$tag" | gzip -1 > /tmp/t4-image/t4-sidecar.tar.gz
          cd /tmp/t4-image
          sha256sum t4-sidecar.tar.gz > SHA256SUMS
          python3 "$GITHUB_WORKSPACE/scripts/image_archive_identity.py" \
            t4-sidecar.tar.gz --revision "$GITHUB_SHA" --tag "$tag" > image-id.json

      - name: Upload NAS deployment archive
        uses: actions/upload-artifact@v4
        with:
          name: nas-image-${{ github.sha }}
          path: /tmp/t4-image/
          retention-days: 3
          if-no-files-found: error
