<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T4 Sidecar</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d9dee5;
      --text: #18212b;
      --muted: #697586;
      --accent: #1f6feb;
      --danger: #b42318;
      --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 22px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 24px; letter-spacing: 0; }
    h2 { font-size: 16px; letter-spacing: 0; }
    .muted { color: var(--muted); }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; margin-bottom: 16px; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: end; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 12px; }
    input, button {
      min-height: 38px; border: 1px solid var(--line); border-radius: 5px;
      background: #fff; color: var(--text); padding: 8px 11px; font: inherit;
    }
    button { cursor: pointer; font-weight: 600; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 22px; margin-top: 10px; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .sources { display: grid; gap: 10px; }
    .source { border-top: 1px solid var(--line); padding-top: 14px; }
    .source:first-child { border-top: 0; padding-top: 0; }
    .source-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .badge { color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .snapshot { margin-top: 12px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; background: #f8fafc; padding: 10px; overflow: auto; }
    .empty { color: var(--muted); padding: 12px 0; }
    @media (max-width: 700px) {
      header { display: block; }
      header .muted { margin-top: 5px; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>T4 Sidecar</h1>
      <p class="muted">AList-TVBox source bridge</p>
    </div>
    <span id="health" class="badge">未检查</span>
  </header>

  <section class="panel">
    <div class="controls">
      <label>Gateway Token
        <input id="token" type="password" autocomplete="off" placeholder="输入 Sidecar token">
      </label>
      <button id="save" class="primary">加载</button>
      <button id="clear">清除</button>
    </div>
    <div id="status" class="status muted"></div>
  </section>

  <section class="panel">
    <div class="source-head">
      <h2>Sources</h2>
      <button id="refresh">刷新</button>
    </div>
    <div id="sources" class="sources"><div class="empty">尚未加载</div></div>
  </section>
</main>
<script>
  const tokenInput = document.querySelector("#token");
  const statusNode = document.querySelector("#status");
  const sourcesNode = document.querySelector("#sources");
  const healthNode = document.querySelector("#health");
  const savedToken = sessionStorage.getItem("t4_token") || "";
  tokenInput.value = savedToken;

  function setStatus(text, kind = "muted") {
    statusNode.textContent = text;
    statusNode.className = `status ${kind}`;
  }

  function headers() {
    return tokenInput.value ? {"X-T4-Token": tokenInput.value} : {};
  }

  async function request(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: {...headers(), ...(options.headers || {})}
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload?.detail?.message || `HTTP ${response.status}`);
    return payload;
  }

  async function checkHealth() {
    try {
      const payload = await request("/t4/health", {headers: {}});
      healthNode.textContent = `${payload.status} · ${payload.version}`;
      healthNode.className = "badge";
    } catch (error) {
      healthNode.textContent = "不可用";
      healthNode.className = "badge";
    }
  }

  function renderSources(sources) {
    sourcesNode.replaceChildren();
    if (!sources.length) {
      sourcesNode.innerHTML = '<div class="empty">没有已配置 source</div>';
      return;
    }
    for (const source of sources) {
      const article = document.createElement("article");
      article.className = "source";
      article.innerHTML = `
        <div class="source-head">
          <h2></h2>
          <span class="badge"></span>
        </div>
        <div class="badge"></div>
        <div class="actions">
          <button data-action="snapshot">读取能力</button>
          <button data-action="smoke">首页冒烟</button>
          <button data-action="copy">复制 T4 地址</button>
        </div>
        <pre class="snapshot" hidden></pre>`;
      article.querySelector("h2").textContent = source.name;
      article.querySelector(".source-head .badge").textContent = source.status;
      article.querySelector(".source-head + .badge").textContent =
        `${source.id} · ${(source.capabilities || []).join(", ") || "待检测"}`;
      const snapshot = article.querySelector(".snapshot");
      article.querySelector('[data-action="snapshot"]').onclick = async () => {
        try {
          snapshot.hidden = false;
          snapshot.textContent = JSON.stringify(
            await request(`/t4/api/sources/${encodeURIComponent(source.id)}/subscription`),
            null, 2
          );
          setStatus(`${source.name} 能力读取完成`, "ok");
        } catch (error) {
          snapshot.hidden = false;
          snapshot.textContent = String(error.message);
          setStatus(error.message, "error");
        }
      };
      article.querySelector('[data-action="smoke"]').onclick = async () => {
        try {
          const payload = await request(`/t4/api/home?source=${encodeURIComponent(source.id)}`);
          snapshot.hidden = false;
          snapshot.textContent = JSON.stringify(payload, null, 2);
          setStatus(`${source.name} 首页冒烟通过`, "ok");
        } catch (error) {
          snapshot.hidden = false;
          snapshot.textContent = String(error.message);
          setStatus(error.message, "error");
        }
      };
      article.querySelector('[data-action="copy"]').onclick = async () => {
        const url = `${location.origin}/t4/api/home?source=${encodeURIComponent(source.id)}&t4_token=${encodeURIComponent(tokenInput.value)}`;
        await navigator.clipboard.writeText(url);
        setStatus("T4 地址已复制", "ok");
      };
      sourcesNode.append(article);
    }
  }

  async function loadSources() {
    sessionStorage.setItem("t4_token", tokenInput.value);
    setStatus("读取中...");
    try {
      const payload = await request("/t4/api/sources");
      renderSources(payload.sources || []);
      setStatus(`已加载 ${(payload.sources || []).length} 个 source`, "ok");
    } catch (error) {
      renderSources([]);
      setStatus(error.message, "error");
    }
  }

  document.querySelector("#save").onclick = loadSources;
  document.querySelector("#refresh").onclick = loadSources;
  document.querySelector("#clear").onclick = () => {
    tokenInput.value = "";
    sessionStorage.removeItem("t4_token");
    renderSources([]);
    setStatus("已清除");
  };
  checkHealth();
  if (savedToken) loadSources();
</script>
</body>
</html>
